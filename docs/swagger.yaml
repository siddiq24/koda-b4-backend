definitions:
  models.CategoryDTO:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  models.Image:
    properties:
      id:
        type: integer
      image:
        type: string
    type: object
  models.JSON_Response:
    properties:
      error: {}
      message:
        type: string
      result: {}
      success:
        type: boolean
      token:
        type: string
    type: object
  models.OrderProductDTO:
    properties:
      product_id:
        type: integer
      qty:
        type: integer
      size_id:
        type: integer
      varian_id:
        type: integer
    required:
    - product_id
    - qty
    - size_id
    type: object
  models.ProductCreateDTO:
    properties:
      base_price:
        type: number
      category_id:
        type: integer
      description:
        type: string
      images:
        items:
          $ref: '#/definitions/models.Image'
        type: array
      sizes:
        items:
          type: integer
        type: array
      stock:
        type: integer
      title:
        type: string
    required:
    - base_price
    - category_id
    - stock
    - title
    type: object
  models.ProductImageDTO:
    properties:
      id:
        type: integer
      image:
        type: string
      product_id:
        type: integer
    required:
    - image
    type: object
  models.ProductUpdateDTO:
    properties:
      base_price:
        type: number
      category_id:
        type: integer
      description:
        type: string
      id:
        type: integer
      stock:
        type: integer
      title:
        type: string
    type: object
  models.TransactionCreateDTO:
    properties:
      products:
        items:
          $ref: '#/definitions/models.OrderProductDTO'
        type: array
      promo_id:
        type: integer
      shipping_id:
        type: integer
      status_id:
        type: integer
      total_order:
        type: number
      user_id:
        type: integer
    required:
    - products
    - shipping_id
    - total_order
    - user_id
    type: object
  models.TransactionUpdateDTO:
    properties:
      id:
        type: integer
      status_id:
        type: integer
    required:
    - status_id
    type: object
  models.UserCreateDTO:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        type: string
    required:
    - email
    - password
    type: object
  models.UserUpdateDTO:
    properties:
      email:
        type: string
      id:
        type: integer
      role:
        type: string
    type: object
host: localhost:8085
info:
  contact: {}
  description: API for user management and authentication
  title: Backend User Management API
  version: "1.0"
paths:
  /admin/categories:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar kategori
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Get all categories
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Membuat kategori baru
      parameters:
      - description: Data kategori
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.CategoryDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - admin
  /admin/categories/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus kategori
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Mengupdate kategori
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data kategori
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/models.CategoryDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - admin
  /admin/products:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar produk dengan paginasi dan filter
      parameters:
      - default: 1
        description: Nomor halaman
        in: query
        name: Page
        type: integer
      - description: Filter pencarian
        in: query
        name: Search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Get all products
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Membuat produk baru
      parameters:
      - description: Data produk
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/models.ProductCreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Create product
      tags:
      - admin
  /admin/products/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus produk (soft delete)
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Delete product
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Mengupdate produk berdasarkan ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data produk
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/models.ProductUpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - admin
  /admin/products/{product_id}/images:
    post:
      consumes:
      - application/json
      description: Menambahkan gambar ke produk
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Data gambar
        in: body
        name: image
        required: true
        schema:
          $ref: '#/definitions/models.ProductImageDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Add product image
      tags:
      - admin
  /admin/products/{product_id}/images/{image_id}:
    delete:
      consumes:
      - application/json
      description: Menghapus gambar produk
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Image ID
        in: path
        name: image_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Delete product image
      tags:
      - admin
    get:
      consumes:
      - application/json
      description: Mendapatkan gambar produk berdasarkan ID
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Image ID
        in: path
        name: image_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Get product image
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Mengupdate gambar produk
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Image ID
        in: path
        name: image_id
        required: true
        type: integer
      - description: Data gambar
        in: body
        name: image
        required: true
        schema:
          $ref: '#/definitions/models.ProductImageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Update product image
      tags:
      - admin
  /admin/transactions:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar transaksi
      parameters:
      - default: 1
        description: Nomor halaman
        in: query
        name: Page
        type: integer
      - description: Filter status
        in: query
        name: Status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Get all transactions
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Membuat transaksi baru
      parameters:
      - description: Data transaksi
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.TransactionCreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Create transaction
      tags:
      - admin
  /admin/transactions/{id}:
    patch:
      consumes:
      - application/json
      description: Mengupdate transaksi (biasanya untuk status)
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data transaksi
        in: body
        name: transaction
        required: true
        schema:
          $ref: '#/definitions/models.TransactionUpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Update transaction
      tags:
      - admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar users
      parameters:
      - default: 1
        description: Nomor halaman
        in: query
        name: Page
        type: integer
      - description: Filter pencarian
        in: query
        name: Search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Membuat user baru
      parameters:
      - description: Data user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UserCreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - admin
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus user (soft delete)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Mengupdate user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data user
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UserUpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Melakukan proses login untuk user yang sudah terdaftar
      parameters:
      - description: Alamat email yang terdaftar
        in: formData
        name: email
        required: true
        type: string
      - description: Password
        in: formData
        minLength: 8
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.JSON_Response'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Mendaftarkan pengguna baru ke sistem
      parameters:
      - description: Nama lengkap user
        in: formData
        name: fullname
        required: true
        type: string
      - description: Alamat email yang valid
        in: formData
        name: email
        required: true
        type: string
      - description: Password minimal 8 karakter
        in: formData
        minLength: 8
        name: password
        required: true
        type: string
      - description: 'Role user (default: user)'
        enum:
        - user
        - admin
        in: formData
        name: role
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.JSON_Response'
      summary: Register new user
      tags:
      - auth
  /order:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Membuat order
      parameters:
      - description: dine in atau pick up
        in: formData
        name: shipping_id
        required: true
        type: integer
      - description: metode pembayaran
        in: formData
        name: payment_method_id
        required: true
        type: integer
      - description: nomor order
        in: formData
        name: no_order
        required: true
        type: integer
      - description: on progres dll
        in: formData
        name: status_id
        required: true
        type: integer
      - description: id promo
        in: formData
        name: promo_id
        required: true
        type: integer
      - description: id product
        in: formData
        name: id
        required: true
        type: integer
      - description: ukuran(reguler, medium, large)
        in: formData
        name: size_id
        required: true
        type: integer
      - description: varian (ice, hot, dll)
        in: formData
        name: variant_id
        required: true
        type: integer
      - description: total item
        in: formData
        name: qty
        required: true
        type: integer
      - description: total harga
        in: formData
        name: total
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Create new order
      tags:
      - order
  /products:
    get:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: Mendapatkan daftar produk dengan paginasi, limit, dan filter berdasarkan
        nama & kategori
      parameters:
      - default: 1
        description: 'Nomor halaman (default: 1)'
        in: query
        minimum: 1
        name: Page
        type: integer
      - description: Filter berdasarkan nama atau deskripsi produk
        in: query
        name: Search
        type: string
      - description: Filter berdasarkan ID kategori
        in: query
        minimum: 1
        name: CategoryId
        type: integer
      - description: Filter harga minimum
        in: query
        minimum: 0
        name: MinPrice
        type: integer
      - description: Filter harga maksimum
        in: query
        minimum: 0
        name: MaxPrice
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mendapatkan daftar produk
          schema:
            allOf:
            - $ref: '#/definitions/models.JSON_Response'
            - properties:
                result:
                  items:
                    type: object
                  type: array
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.JSON_Response'
      summary: Get all products
      tags:
      - products
  /profile:
    patch:
      consumes:
      - application/x-www-form-urlencoded
      description: Update existing user information by ID via form data
      parameters:
      - description: User name
        in: formData
        minLength: 3
        name: fullname
        required: true
        type: string
      - description: User phone
        in: formData
        name: phone
        required: true
        type: string
      - description: User address
        in: formData
        minLength: 6
        name: address
        type: string
      - description: User picture
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.JSON_Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.JSON_Response'
      security:
      - BearerAuth: []
      summary: Update user information
      tags:
      - profile
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
